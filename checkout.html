<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ثبت سفارش | مهرآیین</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><img src="images/logo.png" alt=""><span>مهرآیین</span></a><div class="header-actions"><button class="icon-btn" id="themeToggle">☼</button></div></div></header>
<main class="page-main"><a class="back-link" href="cart.html">← بازگشت به سبد خرید</a><h1>ثبت سفارش</h1><section class="checkout-layout"><form id="checkoutForm" class="panel"><h2>اطلاعات گیرنده</h2><div class="form-grid"><label>نام<input name="firstName" required></label><label>نام خانوادگی<input name="lastName" required></label><label>شماره تلفن همراه<input name="phone" inputmode="tel" required></label><label>استان<input name="province" required></label><label>شهر<input name="city" required></label><label>کد پستی<input name="postalCode"></label></div><label>آدرس کامل<textarea name="address" rows="4" required></textarea></label><div class="payment-box"><h2>پرداخت کارت به کارت</h2><p>لطفاً مبلغ نهایی را به شماره کارت زیر واریز کنید و تصویر فیش را بارگذاری نمایید.</p><div class="card-number"><span id="checkoutCard">شماره کارت هنوز توسط مدیر تنظیم نشده است.</span><button type="button" id="copyCheckoutCard">کپی</button></div><label>تصویر فیش پرداخت<input id="receipt" type="file" accept="image/*" required></label></div><button class="primary-btn full" type="submit">ثبت نهایی سفارش</button></form><aside class="panel" id="checkoutSummary"></aside></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/app.js"></script></body></html>
